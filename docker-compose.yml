# 특허 검색 AI 챗봇 배포: nginx(80) → gunicorn(Django, 8000)
#
# 사전 준비
#   1) web_service/.env 작성 (.env.example 참고: OPENAI_API_KEY, DJANGO_SECRET_KEY 등)
#   2) 벡터 DB를 web_service/db_search/{doc_db,ipc_db} 에 배치
# 실행
#   docker compose up -d --build   →  http://localhost
services:
  web:
    build: ./web_service
    env_file:
      - ./web_service/.env
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1"
      DJANGO_SQLITE_PATH: /app/data/db.sqlite3
    volumes:
      - ./web_service/db_search:/app/db_search      # Chroma 벡터 DB (청구항 / IPC)
      - app_data:/app/data                          # SQLite (회원·대화 기록)
      - app_sessions:/app/sessions                  # 파일 기반 세션
      - static_files:/app/staticfiles               # nginx와 공유
      - hf_cache:/cache/huggingface                 # 임베딩 모델 캐시 (최초 1회 다운로드)
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  app_data:
  app_sessions:
  static_files:
  hf_cache:
